<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - Attendance Portal</title>
<script>
  (() => {
    if (!localStorage.getItem('token')) return;
    try {
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      if (user?.role === 'admin') {
        window.location.replace('admin.html');
      } else if (user?.role === 'employee') {
        window.location.replace('index.html');
      } else {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
      }
    } catch {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
    }
  })();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="card">
      <h1 id="form-title">Welcome back</h1>
      <p class="sub" id="form-sub">Login to mark your attendance</p>

      <form id="auth-form">
        <div id="name-field" style="display:none;">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your name" />
        </div>

        <label>Email</label>
        <input type="email" id="email" placeholder="you@company.com" required />

        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />

        <button type="submit" class="btn-primary" id="submit-btn">Login</button>
        <div class="error" id="error-msg"></div>
      </form>

      <div class="switch-link">
        <span id="switch-text">New employee?</span>
        <a href="#" id="switch-link">Create an account</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
