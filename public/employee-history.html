<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance History - Attendance Portal</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="employee-layout">
  <div class="topbar">
    <button class="drawer-toggle" id="drawer-toggle" type="button" aria-label="Open employee menu" aria-expanded="false">☰</button>
    <div class="brand">📋 Attendance Portal</div>
    <div class="topbar-account"><span class="user-info" id="user-info"></span><button class="logout-btn" id="logout-btn">Logout</button></div>
  </div>
  <aside class="admin-drawer" id="admin-drawer" aria-label="Employee navigation">
    <div class="drawer-title">Employee menu</div>
    <a class="drawer-link" href="index.html">Attendance</a>
    <a class="drawer-link" href="employee-leaves.html">Leave requests</a>
    <a class="drawer-link active" href="employee-history.html" aria-current="page">Attendance history</a>
  </aside>
  <button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="Close employee menu"></button>

  <main class="admin-wrap admin-content">
    <div class="admin-heading"><h1>Attendance history</h1><p>Review your recent daily attendance records.</p></div>
    <section class="admin-card">
      <div class="admin-card-heading"><div><h2>Your attendance records</h2><p>Most recent records appear first.</p></div><button class="admin-refresh" id="refresh-history" type="button">Refresh</button></div>
      <div class="admin-message" id="history-message" role="status"></div>
      <div class="table-scroll">
        <table class="admin-table">
          <thead><tr><th>Date</th><th>Check in</th><th>Breaks</th><th>Check out</th><th>Total (hrs)</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="employee-shell.js"></script>
  <script src="employee-history.js"></script>
</body>
</html>
