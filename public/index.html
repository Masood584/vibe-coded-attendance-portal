<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance - Attendance Portal</title>
<script>
  (() => {
    const token = localStorage.getItem('token');
    let user = null;
    try {
      user = JSON.parse(localStorage.getItem('user') || 'null');
    } catch {
      localStorage.removeItem('user');
    }

    if (!token || !user) {
      window.location.replace('login.html');
    } else if (user.role === 'admin') {
      window.location.replace('admin.html');
    } else if (user.role !== 'employee') {
      window.location.replace('login.html');
    }
  })();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="employee-layout">
  <div class="topbar">
    <button class="drawer-toggle" id="drawer-toggle" type="button" aria-label="Open employee menu" aria-expanded="false">☰</button>
    <div class="brand">📋 Attendance Portal</div>
    <div class="topbar-account">
      <span class="user-info" id="user-info"></span>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </div>

  <aside class="admin-drawer" id="admin-drawer" aria-label="Employee navigation">
    <div class="drawer-title">Employee menu</div>
    <a class="drawer-link active" href="index.html" aria-current="page">Attendance</a>
    <a class="drawer-link" href="employee-leaves.html">Leave requests</a>
    <a class="drawer-link" href="employee-history.html">Attendance history</a>
  </aside>
  <button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="Close employee menu"></button>

  <main class="dashboard-wrap admin-content">
    <div class="status-card">
      <h2>Today</h2>
      <div class="date" id="today-date"></div>
      <div class="office-hours" id="office-hours"></div>
      <div class="leave-day-notice" id="leave-day-notice" role="status" hidden></div>
      <div class="early-checkout-notice" id="early-checkout-notice" role="status" hidden></div>

      <div class="timeline">
        <div class="step" id="step-checkin">
          <span class="label">Check In</span>
          <span class="time">--:--</span>
        </div>
        <div class="step" id="step-breakin">
          <span class="label">Break In</span>
          <span class="time">--:--</span>
        </div>
        <div class="step" id="step-breakout">
          <span class="label">Break Out</span>
          <span class="time">--:--</span>
        </div>
        <div class="step" id="step-checkout">
          <span class="label">Check Out</span>
          <span class="time">--:--</span>
        </div>
      </div>

      <div class="actions">
        <button id="btn-checkin">Check In</button>
        <button id="btn-breakin">Break In</button>
        <button id="btn-breakout">Break Out</button>
        <button id="btn-checkout">Check Out</button>
      </div>

      <div class="msg" id="action-msg"></div>
    </div>

  </main>

  <script src="employee-shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
